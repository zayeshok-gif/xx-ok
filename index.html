<style>
:root{--bg:#080b12;--panel:#101521;--panel2:#151b29;--line:#232c3d;--text:#eef3fb;--muted:#8e9ab0;--accent:#7c5cff;--accent2:#20d6a1;--warn:#f7b955;--danger:#ff6678;--shadow:0 18px 50px rgba(0,0,0,.28);--r:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.16),transparent 60%),radial-gradient(700px 500px at 100% 0,rgba(32,214,161,.08),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh;display:flex}.sidebar{width:260px;background:rgba(10,14,23,.92);border-right:1px solid var(--line);padding:18px;position:fixed;inset:0 auto 0 0;z-index:20;backdrop-filter:blur(18px);transform:translateX(-100%)} .sidebar.open{transform:translateX(0)}.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 24px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9d87ff);font-weight:900;box-shadow:0 10px 30px rgba(124,92,255,.3)}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#aeb9cc;text-align:left;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:#171d2b;color:#fff}.nav .ico{width:22px;text-align:center}.sidebar-foot{position:absolute;bottom:18px;left:18px;right:18px}.user-mini{border:1px solid var(--line);background:#0e141f;padding:12px;border-radius:14px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#20283a;color:#fff;font-weight:800}.main{margin-left:0;width:100%;min-height:100vh}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(8,11,18,.78);backdrop-filter:blur(18px);z-index:10}.topbar h1{font-size:20px;margin:0}.top-actions{display:flex;gap:10px;align-items:center}.iconbtn,.btn{border:1px solid var(--line);background:#121925;color:#eaf0f8;border-radius:12px;padding:10px 13px}.iconbtn{width:42px;height:42px;padding:0}.btn.primary{background:linear-gradient(135deg,var(--accent),#6546e9);border-color:transparent}.btn.success{background:rgba(32,214,161,.13);color:#5ff0c5;border-color:rgba(32,214,161,.3)}.btn.danger{background:rgba(255,102,120,.12);color:#ff8796;border-color:rgba(255,102,120,.28)}.btn.warn{background:rgba(247,185,85,.12);color:#ffd27c;border-color:rgba(247,185,85,.25)}.content{padding:28px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:#9d87ff;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800}.hero h2{font-size:30px;line-height:1.15;margin:6px 0}.hero p{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(18,24,37,.96),rgba(12,17,27,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.stat{min-height:125px}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:30px;font-weight:850;margin:10px 0 4px}.stat .sub{color:#7e8aa0;font-size:12px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #202838;text-align:left;white-space:nowrap}.table th{color:#7f8ba0;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.paid{background:rgba(32,214,161,.11);color:#5ff0c5}.pending{background:rgba(247,185,85,.1);color:#ffd27c}.rejected{background:rgba(255,102,120,.1);color:#ff8796}.neutral{background:#1b2331;color:#aab5c7}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#8d99ad}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0b111b;color:#f2f6fc;border-radius:11px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6e55dd;box-shadow:0 0 0 3px rgba(124,92,255,.12)}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.search{flex:1;min-width:180px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.notice-list{display:grid;gap:10px}.notice{border:1px solid var(--line);background:#0d131e;padding:13px;border-radius:14px}.notice.unread{border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.06)}.notice b{display:block}.notice small{color:var(--muted)}.drawbox{text-align:center;padding:34px;border-radius:20px;background:radial-gradient(circle at 50% 20%,rgba(124,92,255,.22),transparent 55%),#0c121d;border:1px solid var(--line)}.drawnum{font-size:82px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:18px}.winner{font-size:20px;color:#5ff0c5;font-weight:850}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 20% 10%,rgba(124,92,255,.2),transparent 65%),var(--bg)}.login-card{width:min(470px,100%);padding:30px;border:1px solid var(--line);background:rgba(15,21,33,.94);border-radius:26px;box-shadow:var(--shadow)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.demo-switch{display:flex;gap:8px;background:#0a1019;padding:5px;border:1px solid var(--line);border-radius:13px;margin:14px 0}.demo-switch button{flex:1;background:transparent;color:#8d99ad;padding:9px;border-radius:9px}.demo-switch button.active{background:#1b2231;color:#fff}.login-note{color:#7e8aa0;font-size:12px;margin-top:14px}.mobile-menu{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:grid;place-items:center;padding:18px}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#101621;border:1px solid var(--line);border-radius:22px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.slip-preview{width:100%;max-height:360px;object-fit:contain;background:#080b12;border-radius:12px;border:1px solid var(--line)}.toast{position:fixed;right:20px;bottom:20px;z-index:80;background:#151d2b;border:1px solid var(--line);box-shadow:var(--shadow);padding:13px 16px;border-radius:13px;max-width:340px}.toast b{display:block}.menu-toggle{display:block}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.menu-toggle{display:block}.topbar{padding:0 16px}.content{padding:18px}}
@media(max-width:620px){.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:15px}.topbar h1{font-size:17px}.content{padding:14px}.card{padding:15px}.drawnum{font-size:62px}}

/* ===== V2 MODERN UX ===== */
:root{--success:#20d6a1;--glass:rgba(255,255,255,.035)}
body.light{--bg:#f4f7fb;--panel:#fff;--panel2:#f7f9fc;--line:#dce3ee;--text:#172033;--muted:#667085;--shadow:0 14px 35px rgba(35,48,75,.10);background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.10),transparent 60%),#f4f7fb}
body.light .sidebar,body.light .topbar{background:rgba(255,255,255,.88)}
body.light .card{background:linear-gradient(180deg,#fff,#f9fbfe)}
body.light .field input,body.light .field select,body.light .field textarea{background:#fff;color:var(--text)}
body.light .table th,body.light .table td{border-color:#e8edf4}
body.light .notice{background:#f8fafd}
body.light .drawbox{background:radial-gradient(circle at 50% 20%,rgba(124,92,255,.12),transparent 55%),#f8faff}
body.light .nav button{color:#667085}
body.light .nav button:hover,body.light .nav button.active{background:#eef1f8;color:#172033}
.theme-icon{font-size:17px}
.sidebar{transition:transform .22s ease}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.money-card{position:relative;overflow:hidden}
.money-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-80px;background:rgba(124,92,255,.10)}
.money-card .num{font-size:28px}
.financial-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.progress{height:7px;background:#1d2636;border-radius:99px;overflow:hidden;margin-top:10px}
body.light .progress{background:#e7ecf4}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--success));border-radius:99px}
.locked{opacity:.62}
.locked-badge{color:#ff8796;background:rgba(255,102,120,.10);border:1px solid rgba(255,102,120,.2);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.winner-list{display:grid;gap:9px}
.winner-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
.menu-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding:15px 12px 5px}
@media(max-width:1050px){.financial-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.financial-grid{grid-template-columns:1fr}}

body.amharic{font-family:"Noto Sans Ethiopic","Noto Sans",Arial,sans-serif}
body.amharic .num,body.amharic input[type=number]{font-family:Arial,"Noto Sans Ethiopic",sans-serif}
body.amharic .eyebrow{letter-spacing:.03em}
/* ===== V6 BUTTON POLISH ===== */
.btn,.iconbtn,.nav button,.demo-switch button,.gallery-btn{transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease}
.btn{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:rgba(255,255,255,.10);box-shadow:0 7px 18px rgba(37,99,235,.18);font-weight:700}
.btn:hover,.iconbtn:hover,.gallery-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(37,99,235,.22)}
.btn:active,.iconbtn:active,.gallery-btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 7px 20px rgba(109,40,217,.22)}
.btn.success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent;box-shadow:0 7px 20px rgba(5,150,105,.20)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-color:transparent;box-shadow:0 7px 20px rgba(220,38,38,.20)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-color:transparent;box-shadow:0 7px 20px rgba(217,119,6,.20)}
.iconbtn{background:linear-gradient(135deg,#334155,#1e293b);color:#fff;border-color:#475569;box-shadow:0 6px 16px rgba(15,23,42,.18)}
 .menu-toggle{width:46px;height:46px;padding:0;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.menu-toggle svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
.menu-toggle:hover svg{transform:scale(1.06)}
.menu-toggle:focus-visible{outline:3px solid rgba(124,92,255,.25);outline-offset:2px}

#notificationBtn{background:linear-gradient(135deg,#06b6d4,#0284c7);border-color:transparent}
#notificationBtn:hover{box-shadow:0 10px 24px rgba(2,132,199,.25)}
.nav button{border:1px solid transparent}
.nav button:hover{transform:translateX(2px);background:linear-gradient(90deg,rgba(124,92,255,.16),rgba(59,130,246,.08));border-color:rgba(124,92,255,.20)}
.nav button.active{background:linear-gradient(90deg,rgba(124,92,255,.24),rgba(59,130,246,.12));border-color:rgba(124,92,255,.28);box-shadow:inset 3px 0 0 #8b5cf6}
.sidebar-tools{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.sidebar-tool{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,#1e293b,#111827);color:#fff;font-weight:700}
.sidebar-tool.lang-tool{background:linear-gradient(135deg,#7c3aed,#5b21b6);border-color:transparent}
.sidebar-tool.theme-tool{background:linear-gradient(135deg,#f59e0b,#d97706);border-color:transparent}
.sidebar-tool:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(0,0,0,.18)}
.gallery-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border:1px solid transparent;font-weight:800;cursor:pointer;box-shadow:0 7px 18px rgba(37,99,235,.18)}
.gallery-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
body.light .btn{color:#fff}
body.light .iconbtn{background:linear-gradient(135deg,#334155,#1e293b);color:#fff;border-color:#64748b}
body.light .sidebar-tool{color:#fff}
body.light .nav button.active{background:linear-gradient(90deg,#ede9fe,#eff6ff);color:#172033;border-color:#ddd6fe}
body.light .nav button:hover{background:#f1f5f9;color:#172033}
.lang-btn{min-width:92px}


/* ===== V9 NAV + NOTIFICATION + ADMIN CHAT ===== */
.nav .ico{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(124,92,255,.10);color:var(--text);flex:0 0 34px;transition:.18s ease}
.nav .ico svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover .ico{background:rgba(124,92,255,.18);color:#7c5cff;transform:scale(1.04)}
.nav button.active .ico{background:linear-gradient(135deg,#7c5cff,#2563eb);color:#fff;box-shadow:0 5px 14px rgba(99,72,210,.25)}
body.light .nav .ico{background:#f1f5ff;color:#334155}
body.light .nav button:hover .ico{background:#e0e7ff;color:#4f46e5}
body.light .nav button.active .ico{background:linear-gradient(135deg,#7c5cff,#2563eb);color:#fff}
.notif-count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg);line-height:1}
#notificationBtn{position:relative}
.chat-shell{display:grid;grid-template-columns:250px 1fr;gap:16px;min-height:520px}
.chat-people{border:1px solid var(--line);border-radius:18px;background:var(--glass);padding:12px}
.chat-person{width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:var(--text);padding:13px;border-radius:13px;display:flex;align-items:center;gap:10px}
.chat-person.active{background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(59,130,246,.08));border-color:rgba(124,92,255,.35)}
.chat-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#2563eb);color:#fff;font-weight:900}
.chat-main{border:1px solid var(--line);border-radius:18px;background:var(--glass);display:flex;flex-direction:column;overflow:hidden}
.chat-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.chat-messages{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:360px;max-height:470px;overflow:auto}
.chat-msg{max-width:min(78%,520px);padding:10px 13px;border-radius:15px;border:1px solid var(--line);background:var(--panel2)}
.chat-msg.mine{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(59,130,246,.15));border-color:rgba(124,92,255,.32)}
.chat-msg small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.chat-compose{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line)}
.chat-compose input{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 13px;outline:none}
.chat-note{font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:700px){.chat-shell{grid-template-columns:1fr}.chat-people{min-height:auto}.chat-main{min-height:500px}.chat-messages{min-height:330px}}

/* ===== FINAL BUTTON VISIBILITY / LIGHT MODE FIX ===== */
.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;font-weight:800;letter-spacing:.01em;color:#fff!important;background:linear-gradient(135deg,#475569,#334155)!important;border:1px solid rgba(255,255,255,.16)!important}
.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9)!important;color:#fff!important}
.btn.success{background:linear-gradient(135deg,#10b981,#047857)!important;color:#fff!important}
.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)!important;color:#fff!important}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#c2410c)!important;color:#fff!important}
.btn.info{background:linear-gradient(135deg,#06b6d4,#0369a1)!important;color:#fff!important}
.btn.secondary{background:linear-gradient(135deg,#64748b,#475569)!important;color:#fff!important}

/* In Light Mode, buttons stay clearly visible but use dark/black lettering. */
body.light .btn{color:#111827!important;border-color:rgba(15,23,42,.10)!important}
body.light .btn:not(.primary):not(.success):not(.danger):not(.warn):not(.info):not(.secondary){background:linear-gradient(135deg,#e2e8f0,#cbd5e1)!important}
body.light .btn.primary{background:linear-gradient(135deg,#ddd6fe,#c4b5fd)!important}
body.light .btn.success{background:linear-gradient(135deg,#bbf7d0,#86efac)!important}
body.light .btn.danger{background:linear-gradient(135deg,#fecaca,#fca5a5)!important}
body.light .btn.warn{background:linear-gradient(135deg,#fed7aa,#fdba74)!important}
body.light .btn.info{background:linear-gradient(135deg,#bae6fd,#7dd3fc)!important}
body.light .btn.secondary{background:linear-gradient(135deg,#cbd5e1,#94a3b8)!important}
body.light .iconbtn{color:#111827!important}
body.light #notificationBtn{color:#fff!important;background:linear-gradient(135deg,#06b6d4,#0284c7)!important}
body.light .gallery-btn{color:#fff!important}

/* Login role buttons are also visually distinct. */
.demo-switch button{font-weight:800}
.demo-switch button.active{background:linear-gradient(135deg,#ddd6fe,#c4b5fd)!important;color:#111827!important}

/* Disabled buttons remain readable instead of becoming blank white blocks. */
.btn:disabled,.iconbtn:disabled{opacity:.52;cursor:not-allowed;transform:none!important;box-shadow:none!important}


/* V11 premium winner celebration + gold notifications + role-aware chat */
#notificationBtn{background:rgba(245,196,81,.10)!important;border-color:rgba(245,196,81,.38)!important;color:#f5c451!important;box-shadow:0 8px 22px rgba(245,196,81,.08)}
#notificationBtn:hover{background:rgba(245,196,81,.16)!important;box-shadow:0 10px 28px rgba(245,196,81,.16)}
#notificationIcon svg{stroke:#f5c451!important}
.notif-count{background:#f5c451;color:#17120a;min-width:19px;height:19px;padding:0 5px;border-radius:999px;display:grid;place-items:center;font-size:10px;font-weight:900;line-height:19px;border:2px solid var(--bg);box-shadow:0 4px 12px rgba(245,196,81,.28)}
.winner-celebration{position:relative;overflow:hidden;margin-top:14px;padding:24px 20px;border-radius:20px;border:1px solid rgba(245,196,81,.42);background:radial-gradient(circle at 50% 0%,rgba(245,196,81,.22),transparent 48%),linear-gradient(135deg,rgba(245,196,81,.09),rgba(124,92,255,.08));box-shadow:0 16px 40px rgba(0,0,0,.18)}
.winner-celebration:before,.winner-celebration:after{content:"";position:absolute;top:10px;width:7px;height:7px;border-radius:50%;background:#f5c451;box-shadow:18px 20px 0 rgba(245,196,81,.7),-16px 36px 0 rgba(124,92,255,.65),28px 52px 0 rgba(32,214,161,.65),-30px 64px 0 rgba(255,102,120,.55)}
.winner-celebration:before{left:12%;transform:rotate(18deg)}.winner-celebration:after{right:12%;transform:rotate(-18deg)}
.winner-crown{width:54px;height:54px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#ffe59a,#dcae3c);box-shadow:0 12px 28px rgba(245,196,81,.24)}
.winner-crown svg{width:30px;height:30px;stroke:#4b3508;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

function trText(s){return AM[s]||s}

function translateVisibleUI(){
 if((db.settings.lang||'en')!=='am')return;
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode()) nodes.push(walker.currentNode);
 const pairs=Object.entries(AM).sort((a,b)=>b[0].length-a[0].length);
 const fragments=[['Cycle #','ዙር #'],['Week #','ሳምንት #'],['Submitted ','ቀርቧል '],[' · Cycle #',' · ዙር #'],['Cycle #','ዙር #'],['Maximum ','ከፍተኛው '],['Confirmed ','የተረጋገጠ '],['Pending ','በመጠባበቅ ላይ '],['Locked until Equb end','እቁቡ እስኪያልቅ ድረስ ተከልክሏል'],['Winner: ','አሸናፊ፦ '],[' for Cycle #',' ለዙር #']];
 nodes.forEach(n=>{
   let v=n.nodeValue;
   const t=v.trim();
   if(AM[t]) v=v.replace(t,AM[t]);
   else { for(const [a,b] of pairs) if(v.includes(a)) v=v.split(a).join(b); for(const [a,b] of fragments) if(v.includes(a)) v=v.split(a).join(b); }
   n.nodeValue=v;
 });
 document.querySelectorAll('input[placeholder],button[title],option').forEach(el=>{
   if(el.placeholder && AM[el.placeholder]) el.placeholder=AM[el.placeholder];
   if(el.title && AM[el.title]) el.title=AM[el.title];
   const t=(el.textContent||'').trim(); if(AM[t]) el.textContent=AM[t];
 });
}

function applyLanguage(){
  const lang=db.settings.lang||'en';
  document.body.classList.toggle('amharic',lang==='am');
  document.documentElement.lang=lang==='am'?'am':'en';
  document.documentElement.dir='ltr';
  const b=document.getElementById('sidebarLangText');
  if(b)b.textContent=lang==='am'?'English':'አማርኛ';
  const themeText=document.getElementById('sidebarThemeText');
  if(themeText){ const light=db.settings.theme==='light'; themeText.textContent=lang==='am'?(light?'ጨለማ ሁነታ':'ብርሃን ሁነታ'):(light?'Dark mode':'Light mode'); }
  const themeBtn=document.getElementById('sidebarThemeBtn');
  
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=lang==='am'?trText(el.dataset.i18n):el.dataset.i18n}); if(lang==='am') setTimeout(translateVisibleUI,0);
}
function toggleLanguage(){
  db.settings.lang=(db.settings.lang||'en')==='en'?'am':'en';
  save(); render(); applyLanguage();
}

function applyTheme(){
  const t=db.settings.theme||'dark';
  document.body.classList.toggle('light',t==='light');
  const icon=document.getElementById('themeIcon'); if(icon) icon.textContent=t==='light'?'☀':'☾';
}
function toggleTheme(){
  db.settings.theme=(db.settings.theme||'dark')==='dark'?'light':'dark';
  save(); applyTheme(); applyLanguage();
}
function activeMembers(){return db.members.filter(m=>m.active)}
function cyclePayments(){return db.payments.filter(p=>p.cycle===db.settings.cycle)}
function confirmedTotal(){return cyclePayments().filter(p=>p.status==='paid').reduce((a,p)=>a+Number(p.amount||0),0)}
function allConfirmedTotal(){return db.payments.filter(p=>p.status==='paid').reduce((a,p)=>a+Number(p.amount||0),0)}
function expectedTotal(){return activeMembers().length*Number(db.settings.weeklyAmount||0)}
function pendingTotal(){return cyclePayments().filter(p=>p.status==='pending').reduce((a,p)=>a+Number(p.amount||0),0)}
function winnerLocked(id){return (db.draws||[]).some(d=>d.memberId===id && d.lockedUntilEqubEnd)}
function currentCycleDraw(){return (db.draws||[]).find(d=>d.cycle===db.settings.cycle);}
function eligibleDrawMembers(){
  return activeMembers().filter(m=>paymentFor(m.id)?.status==='paid'&&!winnerLocked(m.id));
}
function drawLockedWinners(){
  return (db.draws||[]).filter(d=>d.lockedUntilEqubEnd);
}
function checkEqubEnd(){
  if(db.settings.equbEndDate && new Date(db.settings.equbEndDate+'T23:59:59')<new Date() && db.settings.equbStatus==='active'){
    db.settings.equbStatus='ended'; save();
  }
}
function startNewEqub(){
  db.settings.equbStatus='active';
  db.settings.equbEndDate='';
  db.draws=(db.draws||[]).filter(d=>!d.lockedUntilEqubEnd);
  save(); render(); toast('New Equb started','Previous winner locks have been cleared.');
}

function chatPeerList(){
 const peers=[];

 if(session.role==='admin'){
   peers.push({id:'ADMIN_001',role:'manager',name:'Admin'});
   peers.push({id:'ADMIN_002',role:'manager',name:'Admin 2'});
   activeMembers().forEach(m=>peers.push({id:m.id,role:'user',name:m.name}));
 }else if(session.role==='manager'){
   peers.push({id:'SUPER_ADMIN',role:'admin',name:'Super Admin'});
   activeMembers().forEach(m=>peers.push({id:m.id,role:'user',name:m.name}));

function chatAllowed(fromRole,toRole){

}

function runDraw(){
 checkEqubEnd();
 if(db.settings.equbStatus!=='active')return toast('Equb ended','Start a new Equb before running another draw.');
 if(currentCycleDraw())return toast('Draw already completed','Only one draw is allowed for the current cycle.');
 const eligible=eligibleDrawMembers();
 if(!eligible.length)return toast('No eligible members','Only Paid members who have never won in this Equb can be selected.');
 const num=document.getElementById('drawNum'),win=document.getElementById('drawWinner');
 let i=0;
 const timer=setInterval(()=>{
   num.textContent=String(Math.floor(Math.random()*100)+1).padStart(2,'0');
   if(++i>24){
     clearInterval(timer);
     const arr=new Uint32Array(1); crypto.getRandomValues(arr);
     const m=eligible[arr[0]%eligible.length];
     num.textContent=m.id.replace('M','');
     win.innerHTML='<span class="winner-title">WINNER</span><br>'+esc(m.name)+' — '+esc(m.id);
     db.draws.unshift({memberId:m.id,name:m.name,cycle:db.settings.cycle,at:now(),lockedUntilEqubEnd:true});
     addNotif('superadmin','Draw completed','Winner: '+m.name+' ('+m.id+') for Cycle #'+db.settings.cycle+'. Winner is locked until the Equb ends.','success');
     addNotif(m.id,'You won the Equb draw','Congratulations! You won today’s draw. You are locked from future draws until this Equb ends.','success');
     save();
     toast('Draw complete',m.name+' is now the winner for this week and cannot be selected again in this Equb.');
     setTimeout(render,500);
   }
 },75);
}

    openModal(`<div class="modal-head"><h3>Payment Review</h3><button class="iconbtn" onclick="closeModal()">×</button></div>
      <div class="grid two"><div><div class="notice"><b>${esc(m?.name||p.memberId)}</b><div>${p.memberId} · Cycle #${p.cycle}</div><div>${money(p.amount)} · ${esc(bankName||'-')}</div><div>Payment date: ${p.paidAt?new Date(p.paidAt).toLocaleDateString():'-'}</div><div>Status: ${statusBadge(p.status)}</div></div>
      ${p.status==='pending'?`<div style="display:flex;gap:8px;margin-top:12px"><button class="btn success" onclick="verifyPayment('${p.id}')">✓ Confirm</button><button class="btn danger" onclick="rejectPayment('${p.id}')">✕ Reject</button></div>`:''}</div>
      <div>${p.slipData?`<img class="slip-preview" src="${p.slipData}" alt="Bank slip">`:'<div class="empty">No slip image.</div>'}</div></div>`);
  };

  window.verifyPayment=function(id){
    if(!(session?.role==='admin'||session?.role==='manager')) return;
    const p=db.payments.find(x=>x.id===id); if(!p)return;
    p.status='paid'; p.verifiedAt=Date.now(); p.verifiedBy=session.id;
    audit('PAYMENT_CONFIRMED',{paymentId:id,memberId:p.memberId,cycle:p.cycle});
    addNotif(p.memberId,'Payment Confirmed','Your payment for Cycle #'+p.cycle+' has been confirmed.','success');
    save(); closeModal(); render(); toast('Confirmed','Member is now Paid.');
  };

  window.rejectPayment=function(id){
    if(!(session?.role==='admin'||session?.role==='manager')) return;
    const reason=prompt('Reason for rejection:','Slip could not be verified.');
    if(reason===null)return;
    const p=db.payments.find(x=>x.id===id); if(!p)return;
    p.status='rejected'; p.reason=reason||'Please upload a new slip.';
    audit('PAYMENT_REJECTED',{paymentId:id,memberId:p.memberId,cycle:p.cycle,reason:p.reason});
    addNotif(p.memberId,'Payment Rejected',p.reason,'danger');
    save(); closeModal(); render(); toast('Rejected','Member was notified to upload again.');
  };

  // New Equb: clear winner locks, advance Equb ID and require rules acceptance on registration.
  window.startNewEqub=function(){
    if(!(session?.role==='admin'||session?.role==='manager'))return;
    db.settings.equbId=Number(db.settings.equbId||1)+1;
    db.settings.cycle=1; db.settings.equbStatus='registration'; db.settings.equbEndDate='';
    db.draws=[]; db.drawSessions={}; db.presence={};
    db.settings.rulesVersion=Number(db.settings.rulesVersion||1)+1;
    const old=currentRules();
    const r={id:'R'+db.settings.equbId+'-v'+db.settings.rulesVersion,equbId:db.settings.equbId,version:db.settings.rulesVersion,content:old?.content||'Rules & Regulations',publishedAt:Date.now(),publishedBy:session.id};
    db.rules.push(r);
    audit('NEW_EQUB_STARTED',{equbId:db.settings.equbId});
    save(); render(); toast('New Equb registration','New Equb #'+db.settings.equbId+' is ready for registration and rules acceptance.');
  };

  // Keep current-cycle draw restrictions, but add a shared live session.
  let liveTimer=null, liveChannel=null, presenceTimer=null;
  function liveKey(){return 'equbflow_live_draw_'+db.settings.equbId+'_'+db.settings.cycle;}
  function getLive(){return db.drawSessions[liveKey()]||null;}
  function saveLive(s){db.drawSessions[liveKey()]=s;save(); broadcast();}
  function broadcast(){
    try{ if(!liveChannel) liveChannel=new BroadcastChannel('equbflow-live'); liveChannel.postMessage({db:JSON.stringify(db)}); }catch(e){}
  }
  function syncLive(){
    const s=getLive(); if(!s)return;
    if(s.status==='countdown' && Date.now()>=s.startAt) finishLiveDraw();
    render();
  }
  function setupChannel(){
    try{
      if(liveChannel) liveChannel.close();
      liveChannel=new BroadcastChannel('equbflow-live');
      liveChannel.onmessage=e=>{
        try{const incoming=JSON.parse(e.data.db); if(incoming?.drawSessions){db=incoming;save();render();}}catch(_){}
      };
    }catch(_){}
  }
  function presenceTick(){
    if(!session)return;
    const k=liveKey(), nowMs=Date.now();
    db.presence=db.presence||{};
    db.presence[k]=db.presence[k]||{};
    db.presence[k][session.id]={name:session.name,role:session.role,lastSeen:nowMs};
    Object.keys(db.presence[k]).forEach(id=>{if(nowMs-db.presence[k][id].lastSeen>15000)delete db.presence[k][id];});
    save(); broadcast();
  }
  function viewerCount(){
    const p=db.presence?.[liveKey()]||{};
    const nowMs=Date.now();
    return Object.values(p).filter(x=>nowMs-x.lastSeen<15000).length;
  }

  window.startLiveDraw=function(){
    if(!(session?.role==='admin')) return toast('Super Admin only','Only Super Admin can start the live draw.');
    if(db.settings.equbStatus!=='active')return toast('Equb not active','Start the Equb before the live draw.');
    if(currentCycleDraw())return toast('Draw already completed','Only one draw is allowed for the current cycle.');
    const eligible=eligibleDrawMembers();
    if(!eligible.length)return toast('No eligible members','Only Paid members who have never won in this Equb can be selected.');
    const s={id:'D'+Date.now(),status:'countdown',equbId:db.settings.equbId,cycle:db.settings.cycle,createdAt:Date.now(),startedBy:session.id,startAt:Date.now()+30000,eligibleIds:eligible.map(m=>m.id),roll:[],winnerId:null};
    db.drawSessions[liveKey()]=s;
    audit('LIVE_DRAW_STARTED',{drawId:s.id,cycle:s.cycle,eligibleCount:eligible.length});
    save(); broadcast(); render(); toast('Live draw started','The 30-second countdown is now shared with viewers.');
  };

  function finishLiveDraw(){
    const s=getLive(); if(!s||s.status!=='countdown')return;
    const eligible=s.eligibleIds.map(id=>member(id)).filter(Boolean).filter(m=>paymentFor(m.id)?.status==='paid'&&!winnerLocked(m.id));
    if(!eligible.length)return;
    const arr=new Uint32Array(1);crypto.getRandomValues(arr);
    const m=eligible[arr[0]%eligible.length];
    s.status='complete';s.finishedAt=Date.now();s.winnerId=m.id;s.winnerName=m.name;
    db.draws.unshift({memberId:m.id,name:m.name,cycle:s.cycle,at:now(),lockedUntilEqubEnd:true,drawId:s.id});
    addNotif('superadmin','Draw completed','Winner: '+m.name+' ('+m.id+') for Cycle #'+s.cycle+'.','success');
    addNotif('admin','Draw completed','Winner: '+m.name+' ('+m.id+') for Cycle #'+s.cycle+'.','success');
    db.members.filter(x=>x.active).forEach(x=>addNotif(x.id,'This Week’s Winner',m.name+' won Cycle #'+s.cycle+'.','draw'));
    audit('LIVE_DRAW_COMPLETED',{drawId:s.id,cycle:s.cycle,winnerId:m.id});
    save();broadcast();render();toast('Draw complete',m.name+' is the winner.');
  }

  window.page_liveDraw=function(){
    setupChannel();
    presenceTick();
    clearInterval(presenceTimer);presenceTimer=setInterval(()=>{presenceTick();syncLive();},5000);
    const s=getLive(), eligible=eligibleDrawMembers(), count=viewerCount();
    let body='';
    if(!s) body=`<div class="live-count">—</div><div class="live-roll">Waiting for Super Admin to start the live draw.</div>`;
    else if(s.status==='countdown'){
      const remaining=Math.max(0,s.startAt-Date.now());
      body=`<div class="live-count">${Math.ceil(remaining/1000)}</div><div class="live-countdown">SECONDS</div><div class="live-roll">The draw starts at the same server timestamp for every viewer.</div>`;
    } else {
      body=`<div class="live-count">${String(s.winnerId||'').replace('M','').padStart(2,'0')}</div><div class="live-winner">${esc(s.winnerName||'')}</div><div class="live-roll">WINNER · LOCKED UNTIL EQUB ENDS</div>`;
    }
    return `<div class="hero"><div><div class="eyebrow">Live Equb Draw · Cycle #${db.settings.cycle}</div><h2>Live Draw</h2><p>All viewers follow the same countdown and server-confirmed result.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge paid">${count} watching now</span>${session.role==='admin'&&(!s||s.status==='complete')?`<button class="btn primary" onclick="startLiveDraw()">START LIVE DRAW</button>`:''}</div></div>
      <div class="live-shell"><div class="live-stage"><span class="badge paid live-status">${s?.status==='countdown'?'COUNTDOWN':s?.status==='complete'?'COMPLETED':'READY'}</span><span class="badge neutral live-watch">${count} members watching</span><div>${body}</div></div>
      <div class="card"><div class="section-head"><h3>Live information</h3><span class="badge neutral">Cycle #${db.settings.cycle}</span></div>
      <div class="notice"><b>Eligible members</b><div>${eligible.length} Paid members can enter this draw.</div></div>
      <div class="notice" style="margin-top:10px"><b>One draw per cycle</b><div>A completed cycle cannot be drawn again.</div></div>
      <div class="notice" style="margin-top:10px"><b>No repeat winners</b><div>A winner remains excluded until this Equb ends.</div></div>
      ${s?.status==='complete'?`<div class="winner-celebration"><div class="winner-crown"><svg viewBox="0 0 24 24"><path d="M4 6l3 5 5-7 5 7 3-5-1 11H5L4 6Z"/><path d="M6 20h12"/></svg></div><div class="winner-title">This Week's Winner</div><div class="winner-name">${esc(s.winnerName)}</div></div>`:''}
      </div></div>`;
  };

  // On login, members must accept the current Equb rules before accessing the dashboard.
  const oldStartApp=startApp;
  window.startApp=function(){
    migrate();
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    page=session.role==='admin'||session.role==='manager'?'dashboard':'userDashboard';
    buildNav(); render();
    if(session.role==='user' && !hasAcceptedRules(session.id)){
      setTimeout(()=>openModal(`<div class="modal-head"><h3>Rules & Regulations</h3></div><div class="rules-content">${esc(currentRules().content)}</div><div class="rules-accept"><label style="display:flex;gap:9px;align-items:flex-start"><input id="loginRuleAgree" type="checkbox" style="margin-top:5px"><span>በዚህ ህግ እና ደንብ ተስማምቻለሁ / I agree to these Rules & Regulations.</span></label><button class="btn primary" style="margin-top:12px" onclick="acceptRulesFromLogin()">Accept & Continue</button></div>`),150);
    }
    toast('Welcome',session.name);
  };
  window.acceptRulesFromLogin=function(){
    const c=document.getElementById('loginRuleAgree');
    if(!c?.checked)return toast('Acceptance required','Please read and agree to the Rules & Regulations.');
    const r=currentRules();
    if(!hasAcceptedRules(session.id))db.ruleAcceptances.push({id:'A'+Date.now(),equbId:db.settings.equbId,rulesVersionId:r.id,userId:session.id,acceptedAt:Date.now()});
    audit('RULE_ACCEPTED',{equbId:db.settings.equbId,rulesVersionId:r.id});
    save();closeModal();render();toast('Rules accepted','Welcome to your Equb dashboard.');
  };

  // Improve role-safe chat description without changing the existing visual chat.
  const oldPageChat=page_chat;
  window.page_chat=function(){
    const base=oldPageChat();
    return base.replace('Secure role-based communication. Members can contact staff; staff can communicate with each other.',
      'Members can message Admin or Super Admin. Admins can message members, Super Admin and other Admins. Members cannot message other members.');
  };

  // Ensure translations include the new navigation labels.
  const oldAM=AM;
  Object.assign(AM,{
    "Live Draw":"ቀጥታ እጣ","Rules & Regulations":"ህግ እና ደንብ",
    "Members watching now":"አሁን የሚመለከቱ አባላት"
  });

  // Add a visible Rules item for light/mobile menu and initialize shared live channel.
  setupChannel();
  migrate();
})();


/* FINAL UI FIXES V2 JS */
(function(){
  function roleName(r){return r==='admin'?'Super Admin':r==='manager'?'Admin':'Member'}
  function contacts(){
    if(!session)return [];
    const a=[];
    if(session.role==='user'){
      a.push({id:'SUPER_ADMIN',role:'admin',name:'Super Admin'},{id:'ADMIN_001',role:'manager',name:'Admin'});
    }else if(session.role==='manager'){
      a.push({id:'SUPER_ADMIN',role:'admin',name:'Super Admin'},{id:'ADMIN_002',role:'manager',name:'Admin 2'});
      activeMembers().forEach(m=>a.push({id:m.id,role:'user',name:m.name}));
    }else{
      a.push({id:'ADMIN_001',role:'manager',name:'Admin'},{id:'ADMIN_002',role:'manager',name:'Admin 2'});
      activeMembers().forEach(m=>a.push({id:m.id,role:'user',name:m.name}));
    }
    return a.filter((x,i,z)=>x.id!==session.id&&z.findIndex(y=>y.id===x.id)===i&&chatAllowed(session.role,x.role));
  }
  function ensureChat(){
    if(!session||document.getElementById('dashboardChatFab'))return;
    const f=document.createElement('button');f.id='dashboardChatFab';f.className='dashboard-chat-fab';f.title='Chat';
    f.innerHTML=iconSvg('chat')+'<span class="chat-badge" id="dashboardChatBadge" style="display:none"></span>';
    f.onclick=()=>window.toggleDashChat();document.body.appendChild(f);
    const p=document.createElement('div');p.id='dashboardChatPanel';p.className='dashboard-chat-panel';document.body.appendChild(p);
    drawChatUI();
  }
  function unread(){return (db.chats||[]).filter(m=>m.toId===session?.id&&!m.read).length}
  function drawChatUI(){
    const p=document.getElementById('dashboardChatPanel');if(!p||!session)return;
    const ps=contacts(),sel=(window.dashPeer&&ps.some(x=>x.id===window.dashPeer))?window.dashPeer:ps[0]?.id;
    window.dashPeer=sel;const peer=ps.find(x=>x.id===sel);
    const msgs=peer?(db.chats||[]).filter(m=>(m.fromId===session.id&&m.toId===peer.id)||(m.fromId===peer.id&&m.toId===session.id)):[];
    p.innerHTML='<div class="dcp-head"><div><div class="dcp-title">Chat</div><div class="dcp-sub">Private role-based communication</div></div><button class="iconbtn" onclick="toggleDashChat()">×</button></div>'+
      '<div class="dcp-body">'+(ps.length?ps.map(x=>'<div class="dcp-peer '+(x.id===sel?'active':'')+'" onclick="dashSelectPeer(\''+x.id+'\')"><span class="dcp-avatar">'+esc(x.name.split(' ').map(a=>a[0]).slice(0,2).join(''))+'</span><span><span class="dcp-peer-name">'+esc(x.name)+'</span><br><span class="dcp-peer-role">'+roleName(x.role)+'</span></span></div>').join(''):'<div class="dcp-empty">No permitted contacts.</div>')+
      (peer?'<div class="dcp-messages" id="dashMsgs">'+(msgs.length?msgs.map(m=>'<div class="dcp-msg '+(m.fromId===session.id?'mine':'theirs')+'">'+esc(m.text||'')+'</div>').join(''):'<div class="dcp-empty">Start a conversation with '+esc(peer.name)+'.</div>')+'</div>':'')+'</div>'+
      (peer?'<div class="dcp-compose"><input id="dashChatInput" placeholder="Write a message..." onkeydown="if(event.key===\'Enter\')sendDashChat()"><button class="btn dcp-send" onclick="sendDashChat()">➤</button></div>':'');
    const b=document.getElementById('dashboardChatBadge'),n=unread();if(b){b.textContent=n>99?'99+':n;b.style.display=n?'grid':'none'}
  }
  window.toggleDashChat=function(){ensureChat();const p=document.getElementById('dashboardChatPanel');p.classList.toggle('open');if(p.classList.contains('open')){(db.chats||[]).filter(m=>m.toId===session.id).forEach(m=>m.read=true);save();drawChatUI()}}
  window.dashSelectPeer=function(id){window.dashPeer=id;drawChatUI()}
  window.sendDashChat=function(){
    const t=(document.getElementById('dashChatInput')?.value||'').trim(),peer=contacts().find(x=>x.id===window.dashPeer);
    if(!t||!peer)return;if(!chatAllowed(session.role,peer.role))return toast('Not allowed','This chat direction is not permitted.');
    db.chats=db.chats||[];db.chats.push({id:'C'+Date.now(),fromId:session.id,toId:peer.id,text:t,at:Date.now(),read:false});
    addNotif(peer.id,'New Chat Message',session.name+' sent you a message.','chat');save();drawChatUI();
  }

  function footerRole(){
    const s=document.getElementById('sidebar'),av=document.getElementById('miniAvatar');if(!s||!av)return;
    let el=av.closest('.profile-mini,.user-mini,.mini-profile')||av.parentElement;
    if(el){el.classList.add('sidebar-footer-role');s.appendChild(el)}
  }

  const oldLive=window.page_liveDraw;
  window.page_liveDraw=function(){
    const base=oldLive?oldLive():'';
    if(session?.role!=='admin')return base;
    return base+'<div class="draw-broadcast card"><div class="section-head"><h3>Send message to everyone</h3><span class="badge neutral">All members</span></div><p style="color:var(--muted);font-size:12px">Send one announcement to all active members before or during the draw.</p><textarea id="drawBroadcastText" placeholder="የዚህ ሳምንት እጣ በ 8:00 PM ይጀምራል። Dashboard ላይ Live Draw ይከታተሉ።"></textarea><div class="broadcast-row"><button class="btn primary" onclick="broadcastDrawMessage()">Send to everyone</button><span class="broadcast-status" id="broadcastStatus"></span></div></div>';
  };
  window.broadcastDrawMessage=function(){
    if(session?.role!=='admin')return;const el=document.getElementById('drawBroadcastText'),msg=(el?.value||'').trim();if(!msg)return toast('Message required','Write a message first.');
    activeMembers().forEach(m=>addNotif(m.id,'Draw Announcement',msg,'draw'));audit('DRAW_BROADCAST',{message:msg,recipientCount:activeMembers().length,cycle:db.settings.cycle});save();
    if(el)el.value='';const s=document.getElementById('broadcastStatus');if(s)s.textContent='Sent to '+activeMembers().length+' members.';toast('Announcement sent','All active members received the draw message.');
  };

  const oldRender=window.render;
  window.render=function(){oldRender();if(session){ensureChat();footerRole();drawChatUI()}};
  const oldLogout=window.logout;
  window.logout=function(){document.getElementById('dashboardChatFab')?.remove();document.getElementById('dashboardChatPanel')?.remove();window.dashPeer=null;oldLogout()};
  setTimeout(()=>{if(session){ensureChat();footerRole()}},300);
})();

</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,deleteUser} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,collection,serverTimestamp,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC2J858WIIyvpFkVQZA3avM3jdnl2HXIJ0",authDomain:"equb-design.firebaseapp.com",projectId:"equb-design",storageBucket:"equb-design.firebasestorage.app",messagingSenderId:"468805298005",appId:"1:468805298005:web:5ee7a0a8fa6fbdb59ef1dc"};
const app=initializeApp(cfg),auth=getAuth(app),fs=getFirestore(app);
const auth2=getAuth(initializeApp(cfg,'second')); // creates logins without signing the admin out
const uiLogout=window.logout;
window.CONNECTED=['dashboard','members','admins','userDashboard','profile','myPayment','history','payments','verification']; // pages already wired to Firebase
const PERM={dashboard:'dashboard',members:'members',payments:'payments',verification:'verification'};
let ME=null,ADM=null;
const can=f=>ME&&(ME.role==='superadmin'||(ME.role==='manager'&&(ME.permissions.includes('*')||ME.permissions.includes(f))));
window.pageAllowed=p=>{if(!ME||!window.CONNECTED.includes(p))return false;if(p==='admins')return ME.role==='superadmin';if(ME.role==='manager')return !!PERM[p]&&can(PERM[p]);return true};
const errMsg=e=>e.code==='permission-denied'?'Permission denied':(e.message||e.code);

window.fbLogin=async()=>{const u=document.getElementById('luser').value.trim().toLowerCase(),p=document.getElementById('lpass').value,el=document.getElementById('lerr');el.textContent='';
 try{await signInWithEmailAndPassword(auth,u+'@equbflow.app',p)}
 catch(x){el.textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(x.code)?'Wrong username or password':(x.code||x.message)}};
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 if(!u){ME=null;ADM=null;if(unsubPay){unsubPay();unsubPay=null}uiLogout();return}
 try{
  const a=await getDoc(doc(fs,'accounts',u.uid));
  if(!a.exists()||a.data().disabled){await signOut(auth);document.getElementById('lerr').textContent='Account is not active';return}
  ME={...a.data(),uid:u.uid};
  const s=(await getDoc(doc(fs,'settings','main'))).data()||{};
  db.settings=Object.assign({theme:'dark',lang:'en'},s,JSON.parse(localStorage.getItem('equbflow_prefs')||'{}'));
  if(ME.role==='user'){const m=await getDoc(doc(fs,'members',ME.memberId));db.members=m.exists()?[{id:m.id,...m.data()}]:[]}
  else db.members=(await getDocs(collection(fs,'members'))).docs.map(d=>({id:d.id,...d.data()}));
  db.payments=[];db.notifications=[];db.draws=[];db.chats=[]; // draw / notifications / chat: next phases
  watchPayments();
  window.hasAcceptedRules=()=>true; // temporary until Rules & Regulations is connected
  session={role:ME.role==='superadmin'?'admin':ME.role,id:ME.role==='user'?ME.memberId:u.uid,name:ME.name};
  startApp();
 }catch(x){await signOut(auth);document.getElementById('lerr').textContent=x.code||x.message}});

// ---------- members ----------
window.saveMember=async id=>{const g=x=>document.getElementById(x).value;
 const name=g('mname').trim(),phone=g('mphone').trim(),active=g('mactive')==='true';
 if(!name)return toast('Missing name','Enter the member name.');
 try{
  if(!id){const mid=(g('mid').trim()||('M'+String(Math.max(0,...db.members.map(m=>parseInt(m.id.slice(1))||0))+1).padStart(3,'0'))).toUpperCase();
   if(db.members.some(m=>m.id===mid))return toast('Duplicate','Member ID already exists.');
   const s=db.settings,data={name,phone,active,joinedCycle:s.cycle,arrearsDue:s.weeklyAmount*(s.cycle-1)};
   await setDoc(doc(fs,'members',mid),{...data,createdAt:serverTimestamp()});db.members.push({id:mid,...data})}
  else{await updateDoc(doc(fs,'members',id),{name,phone,active});Object.assign(member(id),{name,phone,active})}
  closeModal();render();toast('Saved','Member saved.')
 }catch(e){toast('Error',errMsg(e))}};

async function createLogin({username,password,name,role,memberId,permissions}){
 username=username.toLowerCase();
 if(!/^[a-z0-9._-]{3,30}$/.test(username))throw Error('Username: 3-30 lowercase letters, digits, . _ -');
 if(password.length<6)throw Error('Password must be at least 6 characters');
 let c;try{c=await createUserWithEmailAndPassword(auth2,username+'@equbflow.app',password)}
 catch(e){throw Error(e.code==='auth/email-already-in-use'?'Username already taken':e.message)}
 try{await setDoc(doc(fs,'accounts',c.user.uid),{username,name,role,memberId,permissions,disabled:false,createdBy:ME.uid,createdAt:serverTimestamp()});
  if(role==='manager')await setDoc(doc(fs,'staffDirectory',c.user.uid),{name,role})}
 catch(e){await deleteUser(c.user).catch(()=>{});throw e}
 await signOut(auth2);return c.user.uid}
window.createMemberLogin=async id=>{const u=document.getElementById('lgu').value.trim(),p=document.getElementById('lgp').value;
 try{const uid=await createLogin({username:u,password:p,name:member(id).name,role:'user',memberId:id,permissions:[]});
  const x={hasLogin:true,username:u.toLowerCase(),uid};await updateDoc(doc(fs,'members',id),x);Object.assign(member(id),x);closeModal();render();toast('Login created',u)}
 catch(e){toast('Error',errMsg(e))}};


// ---------- payments (slip stored as a small compressed image inside the payment document) ----------
let unsubPay=null;
function watchPayments(){
 if(unsubPay){unsubPay();unsubPay=null}
 if(ME.role!=='user'&&!(can('payments')||can('verification'))){db.payments=[];return}
 const base=collection(fs,'payments'),q=ME.role==='user'?query(base,where('memberId','==',ME.memberId)):base;
 unsubPay=onSnapshot(q,sn=>{
  db.payments=sn.docs.map(d=>{const x=d.data();return {...x,id:d.id,verifiedAt:x.verifiedAt&&x.verifiedAt.toMillis?x.verifiedAt.toMillis():x.verifiedAt}}).sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
  const ae=document.activeElement;
  if(!document.getElementById('app').hidden&&!(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))&&!document.getElementById('pslip'))render();
 },e=>toast('Error',errMsg(e)));
}
function slipToData(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{const w=Math.min(900,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  let q=.7,out;do{out=c.toDataURL('image/jpeg',q);q-=.1}while(out.length>600000&&q>.2);URL.revokeObjectURL(url);
  out.length>650000?rej(Error('Image is too large. Use a smaller photo.')):res(out)};
 img.onerror=()=>rej(Error('Could not read the image.'));img.src=url})}
window.submitPayment=async()=>{
 const m=member(session.id),g=x=>document.getElementById(x),amount=Number(g('pamount').value),bank=g('pbank').value,ref=g('pref').value.trim(),date=g('pdate').value,file=g('pslip').files[0];
 if(!amount||!ref||!date)return toast('Incomplete','Please complete amount, reference and date.');
 if(!file)return toast('Slip required','Please select the bank slip image.');
 const old=paymentFor(m.id);if(old&&old.status!=='rejected')return toast('Already submitted',old.status==='paid'?'Payment already confirmed.':'Waiting for verification.');
 try{const slipData=await slipToData(file),s=db.settings;
  await setDoc(doc(fs,'payments',s.cycle+'_'+m.id),{memberId:m.id,cycle:s.cycle,amount,bank,ref,paidAt:new Date(date).getTime(),submittedAt:Date.now(),status:'pending',slipData});
  go('userDashboard');toast('Submitted','Your payment is waiting for verification.')
 }catch(e){toast('Error',errMsg(e))}};
window.verifyPayment=async id=>{try{
 await updateDoc(doc(fs,'payments',id),{status:'paid',verifiedBy:ME.uid,verifiedByName:ME.name,verifiedAt:serverTimestamp()});
 closeModal();toast('Confirmed','Member is now Paid.')}catch(e){toast('Error',errMsg(e))}};
window.rejectPayment=async id=>{const reason=prompt('Reason for rejection:','Slip could not be verified.');if(reason===null)return;
 try{await updateDoc(doc(fs,'payments',id),{status:'rejected',reason:(reason||'Please upload a new slip.').slice(0,200),verifiedBy:ME.uid,verifiedByName:ME.name,verifiedAt:serverTimestamp()});
  closeModal();toast('Rejected','Member was asked to upload again.')}catch(e){toast('Error',errMsg(e))}};

// ---------- admins (Super Admin only) ----------
const FEAT=['dashboard','members','payments','verification','draw','notifications','sms','chat','reports','rules','settings'];
window.page_admins=()=>{
 if(!ADM){getDocs(collection(fs,'accounts')).then(sn=>{ADM=sn.docs.map(d=>({uid:d.id,...d.data()})).filter(a=>a.role==='manager');render()}).catch(e=>toast('Error',errMsg(e)));return '<div class="card">Loading…</div>'}
 return `<div class="hero"><div><div class="eyebrow">Access</div><h2>Admins</h2><p>Create Admin accounts and choose what each one can do.</p></div></div>
 <div class="card"><h3>New Admin</h3><div class="formgrid"><div class="field"><label>Name</label><input id="an"></div><div class="field"><label>Username</label><input id="au"></div><div class="field"><label>Password (min 6)</label><input id="ap" type="password"></div></div>
 <p>${FEAT.map(f=>`<label style="margin-right:14px;display:inline-block"><input type="checkbox" class="aperm" value="${f}"> ${f}</label>`).join('')}</p><button class="btn primary" onclick="newAdmin()">Create Admin</button></div>
 <div class="card" style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th align="left">Name</th><th align="left">Username</th><th align="left">Permissions</th><th></th></tr>${ADM.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.username)}</td><td>${esc((a.permissions||[]).join(', '))}</td><td><button class="btn" onclick="toggleAdmin('${esc(a.uid)}')">${a.disabled?'Enable':'Disable'}</button></td></tr>`).join('')}</table></div>`};
window.newAdmin=async()=>{const perms=[...document.querySelectorAll('.aperm:checked')].map(c=>c.value);
 if(!perms.length)return toast('Permissions','Choose at least one permission.');
 try{await createLogin({username:document.getElementById('au').value.trim(),password:document.getElementById('ap').value,name:document.getElementById('an').value.trim(),role:'manager',memberId:null,permissions:perms});ADM=null;render();toast('Created','Admin account created.')}
 catch(e){toast('Error',errMsg(e))}};
window.toggleAdmin=async uid=>{const a=ADM.find(x=>x.uid===uid);try{await updateDoc(doc(fs,'accounts',uid),{disabled:!a.disabled});a.disabled=!a.disabled;render()}catch(e){toast('Error',errMsg(e))}};
</script>
